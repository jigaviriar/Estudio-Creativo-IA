<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 970" role="img"
     aria-label="Diagrama de arquitectura: la interfaz Streamlit (Estudio, Ética y seguridad, Auditoría) envía una solicitud al wrapper Python, que la procesa en seis pasos en orden — controla acceso, modera, arma el prompt, invoca Bedrock, registra la auditoría y guarda la respuesta — antes de leer o escribir en el almacenamiento local cifrado; el resultado vuelve renderizado al feed. En naranja se resalta la ruta de una llamada real a Bedrock, desde que se invoca hasta quedar registrada como evidencia en el log de auditoría.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6560"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1304" height="954" rx="20" fill="#ffffff" stroke="#ded9d3" stroke-width="1.5"/>

  <g transform="translate(30,30)" font-family="Arial, Helvetica, sans-serif">

    <!-- ============ A. Interfaz de usuario ============ -->
    <rect x="30" y="0" width="1200" height="104" rx="16" fill="#ffffff" stroke="#ded9d3" stroke-width="1.5"/>
    <text x="630" y="34" text-anchor="middle" font-weight="700" font-size="20" fill="#1c1b1a">Interfaz de usuario — Streamlit</text>

    <!-- Tab: Estudio -->
    <rect x="235" y="64" width="384" height="32" rx="16" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <g transform="translate(249,72)">
      <rect x="0" y="0" width="16" height="11" rx="3" fill="none" stroke="#1c1b1a" stroke-width="1.4"/>
      <polygon points="3,11 3,15 7,11" fill="#1c1b1a"/>
    </g>
    <text x="285" y="85" font-weight="500" font-size="12.5" fill="#1c1b1a">Estudio — imágenes, texto, colaboración</text>

    <!-- Tab: Ética y seguridad -->
    <rect x="643" y="64" width="214" height="32" rx="16" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <path transform="translate(657,71)" d="M8,0 L16,3 L16,9 C16,14 8,17 8,17 C8,17 0,14 0,9 L0,3 Z"
          fill="none" stroke="#1c1b1a" stroke-width="1.4" stroke-linejoin="round"/>
    <text x="683" y="85" font-weight="500" font-size="12.5" fill="#1c1b1a">Ética y seguridad</text>

    <!-- Tab: Auditoría -->
    <rect x="881" y="64" width="144" height="32" rx="16" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <g transform="translate(895,70)">
      <rect x="2" y="0" width="12" height="16" rx="2" fill="none" stroke="#1c1b1a" stroke-width="1.4"/>
      <rect x="5" y="-2" width="6" height="3" rx="1" fill="#ffffff" stroke="#1c1b1a" stroke-width="1.2"/>
      <path d="M5,8 L7,11 L11,5" fill="none" stroke="#1c1b1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="921" y="85" font-weight="500" font-size="12.5" fill="#1c1b1a">Auditoría</text>

    <!-- Arrows UI <-> Wrapper -->
    <line x1="560" y1="108" x2="560" y2="188" stroke="#6b6560" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="568" y="152" font-family="Consolas, 'Courier New', monospace" font-weight="500" font-size="11" fill="#6b6560">solicitud</text>
    <line x1="700" y1="188" x2="700" y2="108" stroke="#6b6560" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="708" y="152" font-family="Consolas, 'Courier New', monospace" font-weight="500" font-size="11" fill="#6b6560">resultado</text>

    <!-- ============ C. Wrapper: pipeline numerado ============ -->
    <rect x="30" y="192" width="1200" height="190" rx="16" fill="#ffffff" stroke="#ded9d3" stroke-width="1.5"/>
    <text x="630" y="222" text-anchor="middle" font-weight="700" font-size="20" fill="#1c1b1a">Wrapper de la aplicación (Python)</text>
    <text x="630" y="240" text-anchor="middle" font-weight="400" font-size="11" fill="#6b6560">flujo de una solicitud, en orden →</text>

    <!-- Chevrons entre pasos -->
    <g stroke="#a8a29a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M249,298 L259,308 L249,318"/>
      <path d="M437,298 L447,308 L437,318"/>
      <path d="M625,298 L635,308 L625,318"/>
      <path d="M813,298 L823,308 L813,318"/>
      <path d="M1001,298 L1011,308 L1001,318"/>
    </g>

    <!-- Paso 1 — Control de acceso -->
    <rect x="90" y="266" width="140" height="84" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <circle cx="160" cy="266" r="14" fill="#ffffff" stroke="#6b6560" stroke-width="1.5"/>
    <text x="160" y="271" text-anchor="middle" font-weight="700" font-size="12" fill="#1c1b1a">1</text>
    <text x="160" y="300" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">Control de</text>
    <text x="160" y="317" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">acceso</text>

    <!-- Paso 2 — Modera -->
    <rect x="278" y="266" width="140" height="84" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <circle cx="348" cy="266" r="14" fill="#ffffff" stroke="#6b6560" stroke-width="1.5"/>
    <text x="348" y="271" text-anchor="middle" font-weight="700" font-size="12" fill="#1c1b1a">2</text>
    <text x="348" y="300" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">Modera</text>
    <text x="348" y="317" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">entrada/salida</text>

    <!-- Paso 3 — Arma prompt -->
    <rect x="466" y="266" width="140" height="84" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <circle cx="536" cy="266" r="14" fill="#ffffff" stroke="#6b6560" stroke-width="1.5"/>
    <text x="536" y="271" text-anchor="middle" font-weight="700" font-size="12" fill="#1c1b1a">3</text>
    <text x="536" y="300" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">Arma</text>
    <text x="536" y="317" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">prompt (+ RAG)</text>

    <!-- Paso 4 — Invoca Bedrock (acento) -->
    <rect x="654" y="266" width="140" height="84" rx="10" fill="#fdf1e4" stroke="#ec7211" stroke-width="1.5"/>
    <circle cx="724" cy="266" r="14" fill="#ec7211" stroke="#ec7211" stroke-width="1.5"/>
    <text x="724" y="271" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">4</text>
    <text x="724" y="300" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">Invoca</text>
    <text x="724" y="317" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">Bedrock</text>

    <!-- Paso 5 — Registra auditoría (acento) -->
    <rect x="842" y="266" width="140" height="84" rx="10" fill="#fdf1e4" stroke="#ec7211" stroke-width="1.5"/>
    <circle cx="912" cy="266" r="14" fill="#ec7211" stroke="#ec7211" stroke-width="1.5"/>
    <text x="912" y="271" text-anchor="middle" font-weight="700" font-size="12" fill="#ffffff">5</text>
    <text x="912" y="300" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">Registra</text>
    <text x="912" y="317" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">auditoría</text>

    <!-- Paso 6 — Guarda respuesta -->
    <rect x="1030" y="266" width="140" height="84" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <circle cx="1100" cy="266" r="14" fill="#ffffff" stroke="#6b6560" stroke-width="1.5"/>
    <text x="1100" y="271" text-anchor="middle" font-weight="700" font-size="12" fill="#1c1b1a">6</text>
    <text x="1100" y="300" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">Guarda</text>
    <text x="1100" y="317" text-anchor="middle" font-weight="500" font-size="11" fill="#1c1b1a">respuesta</text>

    <!-- Arrows Wrapper <-> Storage -->
    <line x1="190" y1="382" x2="190" y2="454" stroke="#6b6560" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="198" y="422" font-family="Consolas, 'Courier New', monospace" font-weight="500" font-size="11" fill="#6b6560">guarda</text>
    <line x1="450" y1="454" x2="450" y2="382" stroke="#6b6560" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="458" y="422" font-family="Consolas, 'Courier New', monospace" font-weight="500" font-size="11" fill="#6b6560">lee</text>

    <!-- Arrows Wrapper <-> Bedrock -->
    <line x1="816" y1="382" x2="816" y2="454" stroke="#ec7211" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="824" y="422" font-family="Consolas, 'Courier New', monospace" font-weight="500" font-size="11" fill="#ec7211">invoke_model</text>
    <line x1="1046" y1="454" x2="1046" y2="382" stroke="#ec7211" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1054" y="422" font-family="Consolas, 'Courier New', monospace" font-weight="500" font-size="11" fill="#ec7211">respuesta</text>

    <!-- ============ E. Almacenamiento (izq) ============ -->
    <rect x="30" y="458" width="575" height="380" rx="16" fill="#ffffff" stroke="#ded9d3" stroke-width="1.5"/>
    <text x="317" y="490" text-anchor="middle" font-weight="700" font-size="18" fill="#1c1b1a">Almacenamiento local (cifrado)</text>

    <rect x="50" y="514" width="535" height="48" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <text x="317" y="543" text-anchor="middle" font-weight="500" font-size="13" fill="#1c1b1a">Imágenes generadas + metadatos</text>

    <rect x="50" y="574" width="535" height="48" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <text x="317" y="603" text-anchor="middle" font-weight="500" font-size="13" fill="#1c1b1a">Historial de versiones de contenido</text>

    <rect x="50" y="634" width="535" height="48" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <text x="317" y="663" text-anchor="middle" font-weight="500" font-size="13" fill="#1c1b1a">Comentarios + estado de aprobación</text>

    <rect x="50" y="694" width="535" height="48" rx="10" fill="#f3efe9" stroke="#ded9d3" stroke-width="1"/>
    <text x="317" y="714" text-anchor="middle" font-weight="500" font-size="13" fill="#1c1b1a">Índice vectorial en memoria</text>
    <text x="317" y="730" text-anchor="middle" font-weight="400" font-size="11" fill="#6b6560">(guía de marca, opcional)</text>

    <rect x="50" y="754" width="535" height="48" rx="10" fill="#fdf1e4" stroke="#ec7211" stroke-width="1.5"/>
    <text x="317" y="783" text-anchor="middle" font-weight="500" font-size="13" fill="#1c1b1a">Log de llamadas a Bedrock (JSONL)</text>

    <!-- ============ E. Amazon Bedrock (der, acento) ============ -->
    <rect x="655" y="458" width="575" height="380" rx="16" fill="#fdf1e4" stroke="#ec7211" stroke-width="2"/>
    <text x="942" y="490" text-anchor="middle" font-weight="700" font-size="18" fill="#1c1b1a">Amazon Bedrock</text>
    <text x="942" y="509" text-anchor="middle" font-weight="400" font-size="12" fill="#6b6560">capa de modelos — API gestionada</text>

    <!-- Stable Image -->
    <rect x="675" y="536" width="535" height="72" rx="10" fill="#ffffff" stroke="#ded9d3" stroke-width="1"/>
    <rect x="675" y="536" width="4" height="72" rx="2" fill="#ec7211"/>
    <g transform="translate(700,558)" stroke="#1c1b1a" fill="none">
      <rect x="0" y="0" width="16" height="12" rx="2" stroke-width="1.3"/>
      <circle cx="4" cy="4" r="1.6" fill="#1c1b1a" stroke="none"/>
      <polyline points="1,11 5,6 8,9 11,4 15,11" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <text x="730" y="568" font-weight="500" font-size="13.5" fill="#1c1b1a">Stability AI — Stable Image</text>
    <text x="730" y="587" font-weight="400" font-size="11.5" fill="#6b6560">texto → imagen</text>

    <!-- Claude -->
    <rect x="675" y="624" width="535" height="72" rx="10" fill="#ffffff" stroke="#ded9d3" stroke-width="1"/>
    <rect x="675" y="624" width="4" height="72" rx="2" fill="#ec7211"/>
    <g transform="translate(700,647)" stroke="#1c1b1a" stroke-width="1.6" stroke-linecap="round">
      <line x1="0" y1="0" x2="15" y2="0"/>
      <line x1="0" y1="5" x2="11" y2="5"/>
      <line x1="0" y1="10" x2="13" y2="10"/>
    </g>
    <text x="730" y="656" font-weight="500" font-size="13.5" fill="#1c1b1a">Anthropic Claude</text>
    <text x="730" y="675" font-weight="400" font-size="11.5" fill="#6b6560">edición de texto</text>

    <!-- Titan Embeddings -->
    <rect x="675" y="712" width="535" height="72" rx="10" fill="#ffffff" stroke="#ded9d3" stroke-width="1"/>
    <rect x="675" y="712" width="4" height="72" rx="2" fill="#ec7211"/>
    <g transform="translate(700,734)" stroke="#1c1b1a">
      <line x1="2" y1="10" x2="8" y2="2" stroke-width="1.2"/>
      <line x1="8" y1="2" x2="14" y2="10" stroke-width="1.2"/>
      <circle cx="2" cy="10" r="2" fill="#1c1b1a" stroke="none"/>
      <circle cx="8" cy="2" r="2" fill="#1c1b1a" stroke="none"/>
      <circle cx="14" cy="10" r="2" fill="#1c1b1a" stroke="none"/>
    </g>
    <text x="730" y="744" font-weight="500" font-size="13.5" fill="#1c1b1a">Amazon Titan Embeddings</text>
    <text x="730" y="763" font-weight="400" font-size="11.5" fill="#6b6560">vectores para RAG</text>

    <!-- ============ F. Leyenda ============ -->
    <text x="630" y="866" text-anchor="middle" font-weight="400" font-style="italic" font-size="11.5" fill="#6b6560">
      En naranja: la ruta de una llamada real a Bedrock — desde que el wrapper la invoca (paso 4) hasta quedar registrada como evidencia en el log de auditoría (paso 5).
    </text>
  </g>
</svg>
